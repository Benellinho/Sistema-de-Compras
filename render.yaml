services:
  - type: web
    name: sistema-de-compra-api
    env: node
    rootDir: backend
    buildCommand: npm run render-build
    startCommand: npm start
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: npm_config_build_from_source
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/database.sqlite
      - key: CORS_ORIGIN
        value: https://sistema-compras-preview.web.app,https://sistema-compras-preview.firebaseapp.com,http://localhost:5173
      - key: ORDEM_COMPRA_EMAIL_PROVIDER
        value: local-fake
      - key: PUPPETEER_HEADLESS
        value: new
      - key: PUPPETEER_NO_SANDBOX
        value: "1"
      - key: PDF_PROVIDER_STRICT
        value: "0"
    disk:
      name: sistema-compras-data
      mountPath: /var/data
      sizeGB: 1
