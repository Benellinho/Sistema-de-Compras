<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Solicitação de Orçamento {{documento_codigo}}</title>
    <style>
      :root {
        --primary-dark: #115e59;
        --text: #111827;
        --muted: #5c6873;
        --border: #cbd2d9;
        --surface-muted: #f3f5f7;
        --page-background: #e7eaee;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--page-background);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
      }

      .page {
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        padding: 14mm 12mm;
        background: #fff;
      }

      .document-header {
        display: grid;
        grid-template-columns: 1fr 62mm;
        border: 1px solid var(--text);
      }

      .company-block {
        min-height: 31mm;
        padding: 5mm;
      }

      .document-logo {
        display: block;
        width: 38mm;
        height: 14mm;
        margin-bottom: 3mm;
        object-fit: contain;
        object-position: left center;
      }

      .company-name {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .document-summary { border-left: 1px solid var(--text); }

      .document-title {
        margin: 0;
        padding: 3mm;
        border-bottom: 1px solid var(--text);
        background: var(--surface-muted);
        color: var(--primary-dark);
        font-size: 15px;
        font-weight: 700;
        text-align: center;
        text-transform: uppercase;
      }

      .document-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3mm;
        padding: 4mm;
      }

      .meta-label,
      .field-label {
        display: block;
        margin-bottom: 1mm;
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .meta-value,
      .field-value { font-weight: 600; }

      .document-section {
        margin-top: 5mm;
        border: 1px solid var(--text);
      }

      .section-title {
        margin: 0;
        padding: 2.2mm 3mm;
        border-bottom: 1px solid var(--text);
        background: var(--surface-muted);
        color: var(--primary-dark);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .request-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .info-field {
        min-height: 14mm;
        padding: 3mm;
      }

      .info-field + .info-field { border-left: 1px solid var(--border); }

      .items-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .items-table col.item-number { width: 14mm; }
      .items-table col.item-quantity { width: 22mm; }
      .items-table col.item-unit { width: 18mm; }

      .items-table th,
      .items-table td {
        padding: 2.4mm 2.5mm;
        border: 0;
        border-bottom: 1px solid var(--border);
        color: #000;
        vertical-align: top;
      }

      .items-table th {
        background: #fafbfc;
        font-size: 9px;
        font-weight: 700;
        text-align: left;
        text-transform: uppercase;
      }

      .items-table tbody tr:last-child td { border-bottom: 0; }
      .text-center { text-align: center; }
      .item-index { font-weight: 700; }
      .item-description { line-height: 1.35; }

      .document-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 7mm;
        color: var(--muted);
        font-size: 9px;
      }

      @media print {
        body { background: #fff; }

        .page {
          width: auto;
          min-height: auto;
          margin: 0;
          padding: 0;
        }

        .items-table thead { display: table-header-group; }
        .items-table tr { break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="document-header">
        <section class="company-block">
          <img class="document-logo" src="{{logo_mzl}}" alt="Logotipo MZL">
          <p class="company-name">{{empresa_nome}}</p>
        </section>

        <section class="document-summary">
          <h1 class="document-title">Solicitação de Orçamento</h1>
          <div class="document-meta">
            <div>
              <span class="meta-label">Código</span>
              <span class="meta-value">{{documento_codigo}}</span>
            </div>
            <div>
              <span class="meta-label">Data</span>
              <span class="meta-value">{{data_envio}}</span>
            </div>
          </div>
        </section>
      </header>

      <section class="document-section">
        <h2 class="section-title">Dados da solicitação</h2>
        <div class="request-info">
          <div class="info-field">
            <span class="field-label">Solicitante</span>
            <span class="field-value">{{solicitante_nome}}</span>
          </div>
          <div class="info-field">
            <span class="field-label">Fornecedor</span>
            <span class="field-value">{{fornecedor_razao_social}}</span>
          </div>
        </div>
      </section>

      <section class="document-section">
        <h2 class="section-title">Itens</h2>
        <table class="items-table">
          <colgroup>
            <col class="item-number">
            <col>
            <col class="item-quantity">
            <col class="item-unit">
          </colgroup>
          <thead>
            <tr>
              <th class="text-center">Item</th>
              <th>Descrição</th>
              <th class="text-center">Qtd.</th>
              <th class="text-center">Un.</th>
            </tr>
          </thead>
          <tbody>{{itens_linhas}}</tbody>
        </table>
      </section>

      <footer class="document-footer">
        <span>Documento gerado pelo Sistema de Compras.</span>
        <span>Versão 01: 07/2026</span>
      </footer>
    </main>
  </body>
</html>
